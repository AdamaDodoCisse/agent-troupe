<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Agent Troupe</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Agent Troupe</h1>
      <p class="team" id="team" aria-live="polite"></p>
    </div>
    <div class="controls">
      <span class="conn" id="conn" role="status"><span class="dot" aria-hidden="true"></span><span id="conn-text"></span></span>
      <button type="button" id="demo" class="btn"></button>
      <button type="button" id="pause" class="btn" aria-pressed="false"></button>
      <button type="button" id="lang" class="btn"></button>
    </div>
  </header>

  <main class="layout">
    <section class="scene" id="scene" aria-label="Scène">
      <div class="flights" id="flights" aria-hidden="true"></div>
      <p class="empty" id="empty"></p>
      <div class="desks" id="desks"></div>
    </section>

    <aside class="feed" aria-labelledby="feed-title">
      <h2 id="feed-title"></h2>
      <p class="feed-empty" id="feed-empty"></p>
      <ol id="feed" aria-live="polite" aria-relevant="additions"></ol>
    </aside>
  </main>

  <noscript><p class="noscript">Cette page demande JavaScript.</p></noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
